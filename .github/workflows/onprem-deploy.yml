name: BE 온프레미스 배포 (self-hosted)

on:
  push:
    branches: [onprem]
  workflow_dispatch:

concurrency:
  group: onprem-deploy-be
  cancel-in-progress: false

env:
  # 러너와 BE 앱이 같은 머신(be200 = 192.168.10.200)에 있어 SSH 홉 없이 로컬 실행.
  # devops의 git clone 배포 디렉터리 — 실제 경로가 다르면 여기만 수정.
  DEPLOY_DIR: /home/devops/9-team-Devths-BE

jobs:
  deploy:
    name: be200 로컬 배포
    runs-on: self-hosted
    steps:
      - name: git pull → docker build → compose 재기동
        run: |
          set -euo pipefail
          cd "${DEPLOY_DIR}"

          echo "── git pull (onprem) ──"
          git fetch origin onprem
          git reset --hard origin/onprem

          IMAGE_TAG="onprem-$(git rev-parse --short HEAD)"
          echo "── docker build (${IMAGE_TAG}) ──"
          docker build -t "devths-be:${IMAGE_TAG}" .

          echo "── .env FULL_IMAGE 갱신 ──"
          sed -i '/^FULL_IMAGE=/d' .env
          echo "FULL_IMAGE=devths-be:${IMAGE_TAG}" >> .env

          echo "── compose 재기동 ──"
          docker compose up -d

          echo "── 헬스체크 ──"
          for i in $(seq 1 15); do
            sleep 2
            curl -fsS http://localhost:8080/actuator/health && curl -fsS http://localhost:8081/actuator/health && break
            [ "$i" -eq 15 ] && { echo "헬스체크 실패"; exit 1; }
          done

          echo "── 오래된 이미지 정리 ──"
          docker image prune -f
